---
# Rollback Docker service to previous version
# Usage: ansible-playbook rollback.yml -e "service=frontend"
# Usage: ansible-playbook rollback.yml -e "service=all"

- name: Rollback Docker Service
  hosts: managers
  gather_facts: yes

  vars:
    target_service: "{{ service | default('') }}"

  pre_tasks:
    - name: Validate service parameter
      fail:
        msg: "Please specify a service to rollback using -e 'service=<service_name>' or 'service=all'"
      when: target_service == ''

  tasks:
    - name: Display rollback information
      debug:
        msg: |
          Rolling back service: {{ target_service }}
          Environment: {{ environment }}
          Stack: {{ stack_name }}

    - name: Get list of services
      command: docker stack services {{ stack_name }} --format "{{ '{{' }}.Name{{ '}}' }}"
      register: stack_services
      changed_when: false
      when: target_service == 'all'

    - name: Rollback all services
      command: docker service rollback {{ item }}
      loop: "{{ stack_services.stdout_lines }}"
      when: target_service == 'all'
      register: rollback_all
      tags: [rollback, all]

    - name: Rollback specific service
      command: docker service rollback {{ stack_name }}_{{ target_service }}
      when: target_service != 'all'
      register: rollback_service
      tags: [rollback, service]

    - name: Wait for rollback to complete
      pause:
        seconds: 10

    - name: Verify services status
      command: docker stack services {{ stack_name }}
      register: services_status
      changed_when: false

    - name: Display services status
      debug:
        msg: "{{ services_status.stdout_lines }}"

    - name: Check for failed services
      command: >
        docker stack ps {{ stack_name }}
        --filter "desired-state=running"
        --format "{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.CurrentState{{ '}}' }}"
      register: services_state
      changed_when: false

    - name: Display services state
      debug:
        msg: "{{ services_state.stdout_lines }}"
